groups:
  - name: paymesh-routing
    rules:
      - alert: RoutingHighRouteNotFoundRate
        expr: |
          (
            sum(increase(routing_quotes_total{outcome="route_not_found"}[15m]))
            /
            sum(increase(routing_quotes_total[15m]))
          ) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'More than 10% of quote requests found no route in the last 15m'
          description: 'Check provider health (RPCs, LI.FI/1inch/Across API keys, CCTP Iris) and recent config changes.'

      - alert: RoutingQuoteLatencyHigh
        expr: |
          (
            sum(increase(routing_quote_latency_ms_sum[15m]))
            /
            sum(increase(routing_quote_latency_ms_count[15m]))
          ) > 5000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Average quote latency exceeded 5s over the last 15m'
          description: 'A slow or timing-out provider is likely delaying the whole quote fan-out.'

      - alert: RoutingFallbackSpike
        expr: |
          sum(increase(routing_fallback_requotes_total[15m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'More than 5 fallback re-quotes in 15 minutes'
          description: 'Mid-route failures are unusually frequent; check the failing adapter/bridge in routing_routes_discarded_total.'

      - alert: PaymeshApiUnreachable
        expr: up{job="paymesh-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Prometheus cannot scrape the PayMesh API /v1/metrics endpoint'
          description: 'The API process may be down, or the metrics endpoint is unreachable from Prometheus.'

      - alert: PaymeshApi5xxRateHigh
        expr: |
          (
            sum(rate(paymesh_api_http_requests_total{status_class="5xx"}[5m]))
            /
            sum(rate(paymesh_api_http_requests_total[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'More than 1% of API requests returned 5xx over the last 5 minutes'
          description: 'PRD §13 SLA: 99.9% API uptime. Check for crashes, DB connection exhaustion, or provider timeouts.'

      - alert: PaymeshDepositsStuck
        expr: paymesh_deposits_stuck > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Deposits are stuck in a non-terminal state for more than 10 minutes'
          description: 'PRD §Monitoring: any deposit stuck > 10 minutes must alert. Check the tx-monitor/settlement queues and the recovery sweep.'

      - alert: PaymeshQueueBacklogGrowth
        expr: |
          sum by (queue) (
            max_over_time(paymesh_queue_backlog[15m])
          ) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'A BullMQ queue backlog has been above 100 jobs for 10 minutes'
          description: 'PRD §13: queue backlog growth is an early signal of a stalled worker. Check worker health per queue.'

      - alert: PaymeshSettlementSlaBreach
        expr: |
          (
            sum(increase(routing_quote_latency_ms_bucket_count[2m]))
            -
            sum(increase(routing_quote_latency_ms_bucket{le="2000"}[2m]))
          )
          /
          sum(increase(routing_quote_latency_ms_bucket_count[2m])) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'More than 1% of quotes took longer than 2 seconds over the last 10 minutes'
          description: 'PRD §13 SLA: 99% of deposits settle within 2 minutes. Slow quotes indicate provider or RPC degradation.'
