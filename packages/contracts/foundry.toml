[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
gas_reports = ["DepositReceiver", "MockDEX", "MockBridge"]
fs_permissions = [{ access = "read-write", path = "./" }]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 64

[fmt]
line_length = 100