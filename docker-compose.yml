services:
  postgres:
    image: postgres:16-alpine
    container_name: paymesh-postgres
    environment:
      POSTGRES_USER: paymesh
      POSTGRES_PASSWORD: paymesh
      POSTGRES_DB: paymesh
    ports:
      - "5432:5432"
    volumes:
      - paymesh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymesh -d paymesh"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: paymesh-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paymesh_pgdata: