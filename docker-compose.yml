services:
  postgres:
    image: postgres:16-alpine
    container_name: paymesh-postgres
    environment:
      POSTGRES_USER: paymesh
      POSTGRES_PASSWORD: paymesh
      POSTGRES_DB: paymesh
    ports:
      - "5432:5432"
    volumes:
      - paymesh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymesh -d paymesh"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: paymesh-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Observability stack (PRD §Monitoring & Observability). Scrapes the API's
  # /v1/metrics endpoint and ships the routing dashboard + alert rules.
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: paymesh-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - paymesh_promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.1.0
    container_name: paymesh-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - paymesh_grafdata:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  paymesh_pgdata:
  paymesh_promdata:
  paymesh_grafdata: